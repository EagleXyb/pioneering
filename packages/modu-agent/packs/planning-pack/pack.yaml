name: planning-pack
version: 0.1.0
description: 任务规划领域包（task / plan_execute）——任务规划领域上下文 + 护栏 + 步骤类型
capabilities:
  - domain
  - guardrail
  - sop
config_profile:
  graph_spec_extra:
    planning_pack_enabled: true
  agent_overrides:
    # 启用四层 Prompt 组装（消费 task_planner 领域层）与写操作护栏
    react_optimization.prompt_composer.enabled: true
    react_optimization.action_guardrails.enabled: true
