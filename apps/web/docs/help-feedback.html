<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帮助与反馈</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background-color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Window frame */
    .window {
      width: 900px;
      height: 600px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 16px 56px rgba(0, 0, 0, 0.14);
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 230px;
      background-color: #f2f2f2;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #262626;
      cursor: pointer;
      transition: background-color 0.15s ease;
      user-select: none;
    }

    .nav-item:hover {
      background-color: #e8e8e8;
    }

    .nav-item--active {
      background-color: #e0e0e0;
    }

    .nav-item--active:hover {
      background-color: #e0e0e0;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      color: #8c8c8c;
      flex-shrink: 0;
    }

    .nav-item--active .nav-icon {
      color: #595959;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 32px 40px;
      position: relative;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 20px;
      height: 20px;
      color: #8c8c8c;
      cursor: pointer;
      transition: color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: #595959;
    }

    .close-btn svg {
      width: 16px;
      height: 16px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .help-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .help-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background-color: #f7f7f7;
      border-radius: 8px;
      font-size: 14px;
      color: #262626;
      cursor: pointer;
      transition: background-color 0.15s ease;
      user-select: none;
    }

    .help-item:hover {
      background-color: #f0f0f0;
    }

    .help-item__left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .help-item__icon {
      width: 18px;
      height: 18px;
      color: #8c8c8c;
    }

    .help-item__arrow {
      width: 14px;
      height: 14px;
      color: #bfbfbf;
    }

    .help-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #bfbfbf;
    }

    .help-footer a {
      color: #bfbfbf;
      text-decoration: none;
    }

    .help-footer a:hover {
      color: #8c8c8c;
    }

    .help-footer__divider {
      margin: 0 8px;
      color: #d9d9d9;
    }
  </style>
</head>
<body>
  <div class="window">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul class="nav-list">
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          账户管理
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          系统设置
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path><path d="M9 19h6v2H9z"></path></svg>
          智能体设置
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01"></path><path d="M10 10h.01"></path><path d="M14 10h.01"></path><path d="M18 10h.01"></path></svg>
          快捷键
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1M6.343 4.343l-.707-.707M18.364 4.343l.707-.707M4 12h1M20 12h1M12 18.5a1.5 1.5 0 0 1-1.5-1.5c0-1.5 2-3 2-5.5 0-1.5-1-2.5-2.5-2.5S7.5 10 7.5 12c0 2.5 2 4 2 5.5a1.5 1.5 0 0 1-1.5 1.5h-3C4.5 19 4 18.5 4 18s.5-1 1-1h.5A7.5 7.5 0 0 1 12 5.5a7.5 7.5 0 0 1 6.5 11h.5c.5 0 1 .5 1 1s-.5 1-1 1h-3a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>
          记忆
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16.75-4.14-2.4a.74.74 0 0 0-.72 0l-4.83 2.8a.74.74 0 0 1-.72 0L5.71 14.3a.74.74 0 0 0-.71 0L2 16.36V6.12a.76.76 0 0 1 .38-.65l4.14-2.39a.74.74 0 0 1 .72 0l4.83 2.8a.74.74 0 0 0 .72 0l4.83-2.8a.74.74 0 0 1 .72 0l4.14 2.39a.76.76 0 0 1 .38.65v10.63z"></path><path d="m2 6 9 5.25"></path><path d="M12 16.5 3 11.25"></path><path d="m12 16.5 9-5.25"></path><path d="M12 16.5V7.5"></path></svg>
          模型
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          助理设置
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>
          个性化
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="6" rx="2"></rect><path d="M6 9v11"></path><path d="M18 9v11"></path><path d="M6 15h12a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2Z"></path></svg>
          数据管理
        </li>
        <li class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          安全中心
        </li>
        <li class="nav-item nav-item--active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          帮助与反馈
        </li>
      </ul>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="close-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </div>

      <h1 class="page-title">帮助与反馈</h1>

      <ul class="help-list">
        <li class="help-item">
          <span class="help-item__left">
            <svg class="help-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            帮助文档
          </span>
          <svg class="help-item__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </li>
        <li class="help-item">
          <span class="help-item__left">
            <svg class="help-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            意见反馈
          </span>
        </li>
        <li class="help-item">
          <span class="help-item__left">
            <svg class="help-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            联系我们
          </span>
          <svg class="help-item__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </li>
      </ul>

      <div class="help-footer">
        <a href="#">隐私政策</a><span class="help-footer__divider">|</span><a href="#">服务协议</a>
      </div>
    </main>
  </div>
</body>
</html>
