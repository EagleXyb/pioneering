<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>桌面端 AI Agent 输入区 · 交互原型</title>
<style>
  :root{
    --background:#FFFFFF; --foreground:#18181B; --muted:#F4F4F5; --muted-foreground:#71717A;
    --border:#E4E4E7; --primary:#6D28D9; --primary-hover:#5B21B6; --primary-active:#4C1D95;
    --ring:rgba(109,40,217,.20); --composer-bg:#FFFFFF; --page-bg:#F4F4F5; --chip-bg:#F4F4F5;
    --chip-text:#3F3F46; --hover-border:#D4D4D8; --btn-hover:#E4E4E7; --stop-bg:#18181B; --stop-fg:#FFFFFF;
  }
  [data-theme="dark"]{
    --background:#0A0A0B; --foreground:#FAFAFA; --muted:#18181B; --muted-foreground:#A1A1AA;
    --border:#27272A; --primary:#8B5CF6; --primary-hover:#7C3AED; --primary-active:#6D28D9;
    --ring:rgba(139,92,246,.30); --composer-bg:#0A0A0B; --page-bg:#000000; --chip-bg:#18181B;
    --chip-text:#D4D4D8; --hover-border:#3F3F46; --btn-hover:#27272A; --stop-bg:#FAFAFA; --stop-fg:#18181B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:Inter,ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--page-bg); color:var(--foreground);
    display:flex; flex-direction:column; min-height:100vh; transition:background .2s,color .2s;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--border); background:var(--composer-bg);
  }
  .topbar h1{font-size:15px; font-weight:600; margin:0;}
  .topbar .sub{font-size:12px; color:var(--muted-foreground); margin-top:2px;}
  .theme-btn{
    border:1px solid var(--border); background:var(--muted); color:var(--foreground);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .theme-btn:hover{background:var(--btn-hover);}
  .chat{
    flex:1; width:100%; max-width:768px; margin:0 auto;
    padding:24px 16px 8px; display:flex; flex-direction:column; gap:14px; overflow-y:auto;
  }
  .msg{max-width:80%; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.6; word-break:break-word;}
  .msg.user{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start; background:var(--muted); color:var(--foreground); border-bottom-left-radius:4px;}
  .typing{display:inline-flex; gap:5px; align-items:center; height:18px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--muted-foreground); animation:blink 1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
  .composer-wrap{position:sticky; bottom:0; padding-top:16px; background:linear-gradient(to top,var(--page-bg) 70%,transparent);}
  .composer{max-width:768px; margin:0 auto; padding:0 16px 20px;}
  .card{
    border:1px solid var(--border); border-radius:16px; background:var(--composer-bg);
    transition:border-color .15s, box-shadow .15s, background .15s; padding:8px;
  }
  .card.focus{border-color:color-mix(in srgb,var(--primary) 50%,var(--border)); box-shadow:0 0 0 3px var(--ring);}
  .card.dragging{border-color:var(--primary); background:color-mix(in srgb,var(--primary) 5%,var(--composer-bg));}
  .chips{display:flex; flex-wrap:wrap; gap:8px; padding:8px 8px 0;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--chip-bg); color:var(--chip-text);
    font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid var(--border);
  }
  .chip .x{cursor:pointer; opacity:.6; font-size:13px; line-height:1;}
  .chip .x:hover{opacity:1;}
  textarea{
    width:100%; border:0; outline:0; background:transparent; color:var(--foreground);
    font:inherit; font-size:15px; line-height:24px; padding:10px 14px; resize:none;
    max-height:200px; min-height:24px; display:block;
  }
  .toolbar{display:flex; align-items:center; justify-content:space-between; padding:4px 8px 6px;}
  .tools{display:flex; align-items:center; gap:6px; position:relative;}
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:0; background:var(--muted); color:var(--foreground);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{background:var(--btn-hover);}
  .model-btn{
    height:32px; border-radius:16px; background:var(--muted); border:0; padding:0 12px;
    font-size:13px; color:var(--foreground); cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  .model-btn:hover{background:var(--btn-hover);}
  .right{display:flex; align-items:center; gap:12px;}
  .hint{font-size:12px; color:var(--muted-foreground);}
  .send{
    width:36px; height:36px; border-radius:50%; border:0; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .08s, background .15s;
  }
  .send:hover:not(:disabled){background:var(--primary-hover);}
  .send:active:not(:disabled){background:var(--primary-active); transform:scale(.94);}
  .send:disabled{background:var(--muted); color:var(--muted-foreground); cursor:not-allowed;}
  .send.stop{background:var(--stop-bg); color:var(--stop-fg);}
  .popover{
    position:absolute; bottom:42px; left:0; background:var(--composer-bg); border:1px solid var(--border);
    border-radius:12px; padding:6px; width:184px; box-shadow:0 8px 24px rgba(0,0,0,.12); display:none; z-index:10;
  }
  .popover.open{display:block;}
  .popover button{
    display:flex; width:100%; text-align:left; background:0; border:0; padding:8px 10px;
    border-radius:8px; font-size:14px; color:var(--foreground); cursor:pointer; align-items:center; gap:8px;
  }
  .popover button:hover{background:var(--muted);}
  .footnote{max-width:768px; margin:0 auto; padding:0 20px 16px; font-size:12px; color:var(--muted-foreground);}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>桌面端 AI Agent 输入区 · 原型</h1>
      <div class="sub">shadcn/ui + Radix UI · 含自适应高度 / 快捷键 / 附件 / 生成态</div>
    </div>
    <button class="theme-btn" id="themeBtn">切换 Dark</button>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">你好，我是 WorkBuddy。试试在下方输入多行内容，或拖拽文件到输入框。</div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <div class="card" id="card">
        <div class="chips" id="chips"></div>
        <textarea id="ta" rows="1" placeholder="你想知道什么？@引用对话文件，/调用技能与指令"></textarea>
        <div class="toolbar">
          <div class="tools">
            <button class="icon-btn" id="attachBtn" title="添加附件" aria-label="添加附件">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
            <div class="popover" id="popover">
              <button data-kind="file">上传文件</button>
              <button data-kind="image">上传图片</button>
              <button data-kind="snip">截图</button>
            </div>
          </div>
          <div class="right">
            <button class="model-btn">Model ▾</button>
            <button class="send" id="sendBtn" disabled aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="footnote">提示：空输入时发送按钮置灰；输入后变紫；生成中变为停止方块。拖拽文件到输入框可高亮并添加附件。</div>
  </div>

  <input type="file" id="fileInput" multiple hidden />

<script>
  const ta = document.getElementById('ta');
  const card = document.getElementById('card');
  const sendBtn = document.getElementById('sendBtn');
  const chipsEl = document.getElementById('chips');
  const popover = document.getElementById('popover');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const chat = document.getElementById('chat');
  const themeBtn = document.getElementById('themeBtn');

  let isGenerating = false;
  const arrowSVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';
  const stopSVG = '<svg width="16" height="16" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';

  function autoResize(){
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  }
  function updateSend(){
    sendBtn.disabled = isGenerating ? false : ta.value.trim().length === 0;
  }
  function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

  ta.addEventListener('input', () => { autoResize(); updateSend(); });
  ta.addEventListener('focus', () => card.classList.add('focus'));
  ta.addEventListener('blur', () => card.classList.remove('focus'));
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing){
      e.preventDefault();
      if (!sendBtn.disabled) send();
    }
  });

  function addMsg(role, html){
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.innerHTML = html;
    chat.appendChild(el);
    scrollBottom();
    return el;
  }

  function setGenerating(on){
    isGenerating = on;
    if (on){
      sendBtn.classList.add('stop');
      sendBtn.innerHTML = stopSVG;
      sendBtn.onclick = stop;
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.innerHTML = arrowSVG;
      sendBtn.onclick = send;
    }
    updateSend();
  }

  function send(){
    const text = ta.value.trim();
    if (!text || isGenerating) return;
    addMsg('user', text.replace(/</g,'&lt;'));
    ta.value = ''; autoResize();
    setGenerating(true);
    const bot = addMsg('bot', '<span class="typing"><span></span><span></span><span></span></span>');
    setTimeout(() => {
      bot.textContent = '已收到你的输入（这是前端模拟回复）。接入真实接口时替换 onSend / onStop 回调即可。';
      setGenerating(false);
    }, 1600);
  }

  function stop(){
    setGenerating(false);
  }

  // 附件 Popover
  attachBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    popover.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!popover.contains(e.target) && e.target !== attachBtn) popover.classList.remove('open');
  });
  popover.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      popover.classList.remove('open');
      fileInput.click();
    });
  });
  fileInput.addEventListener('change', () => {
    for (const f of fileInput.files) addChip(f.name);
    fileInput.value = '';
  });

  function addChip(name){
    const c = document.createElement('span');
    c.className = 'chip';
    c.innerHTML = '<span></span><span class="name"></span><span class="x">✕</span>';
    c.querySelector('.name').textContent = name;
    c.querySelector('.x').addEventListener('click', () => c.remove());
    chipsEl.appendChild(c);
  }

  // 拖拽
  card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('dragging'); });
  card.addEventListener('dragleave', () => card.classList.remove('dragging'));
  card.addEventListener('drop', (e) => {
    e.preventDefault(); card.classList.remove('dragging');
    for (const f of e.dataTransfer.files) addChip(f.name);
  });

  // 主题
  themeBtn.addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    themeBtn.textContent = dark ? '切换 Dark' : '切换 Light';
  });

  // 默认发送按钮行为
  sendBtn.onclick = send;
</script>
</body>
</html>
