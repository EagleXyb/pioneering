<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>聊天输入框组件 · Chat Input Box</title>
<style>
  :root {
    /* 严格还原设计稿 token */
    --canvas-bg: #F8F6F2;        /* 画布背景 温暖奶油色 */
    --card-bg: #FFFFFF;          /* 卡片背景 */
    --card-border: #E8EDEB;      /* 卡片/按钮描边 */
    --card-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
    --radius-card: 12px;         /* 卡片圆角 */
    --radius-btn: 8px;           /* 按钮圆角 */
    --radius-send: 18px;         /* 发送按钮圆角(36/2) */

    --text-primary: #1A1A1A;
    --text-model: #374151;       /* 模型文字 */
    --text-secondary: #5C5C5C;
    --placeholder: #9CA3AF;      /* 占位文字 */
    --icon-stroke: #6B7280;      /* 图标描边 */

    --send-enabled: #4F46E5;     /* 发送按钮 靛蓝 */
    --send-enabled-hover: #4338CA;
    --send-enabled-active: #3730A3;
    --send-disabled: #E5E7EB;    /* 发送按钮 置灰 */
    --send-disabled-icon: #9CA3AF;

    --hover-bg: rgba(17, 24, 39, 0.04);
    --active-bg: rgba(17, 24, 39, 0.08);

    --pad-y: 16px;
    --pad-x: 20px;
    --gap: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--canvas-bg);
    font-family: "Inter", "SF Pro Text", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 卡片容器 ===== */
  .chat-input-box {
    width: 100%;
    max-width: 780px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: var(--pad-y) var(--pad-x);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  /* ===== 多行文本区域（自动撑开） ===== */
  .textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-primary);
    min-height: 24px;
    max-height: 240px;
    overflow-y: auto;
    padding: 0;
  }
  .textarea::placeholder {
    color: var(--placeholder);
  }

  /* ===== 底部操作栏 ===== */
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .right-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ===== 通用工具按钮（图标型） ===== */
  .tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: var(--radius-btn);
    padding: 6px 10px;
    cursor: pointer;
    color: var(--icon-stroke);
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .tool-btn:hover { background: var(--hover-bg); }
  .tool-btn:active { background: var(--active-bg); transform: scale(0.96); }
  .tool-btn:focus-visible {
    outline: 2px solid var(--send-enabled);
    outline-offset: 1px;
  }
  .tool-btn svg { display: block; }

  /* ===== 模型选择器（下拉） ===== */
  .model-select {
    position: relative;
  }
  .model-trigger {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: transparent;
    border-radius: var(--radius-btn);
    padding: 6px 12px 6px 8px;
    cursor: pointer;
    color: var(--text-model);
    font-family: inherit;
    font-size: 13px;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .model-trigger:hover { background: var(--hover-bg); }
  .model-trigger:active { background: var(--active-bg); transform: scale(0.98); }
  .model-trigger:focus-visible { outline: 2px solid var(--send-enabled); outline-offset: 1px; }
  .model-trigger .chevron { transition: transform 0.18s ease; }
  .model-select.open .model-trigger .chevron { transform: rotate(180deg); }

  .model-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    min-width: 180px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-btn);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
    padding: 6px;
    z-index: 20;
    display: none;
  }
  .model-select.open .model-menu { display: block; }
  .model-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    border: none;
    background: transparent;
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-model);
    transition: background 0.12s ease;
  }
  .model-option:hover { background: var(--hover-bg); }
  .model-option.active { background: rgba(79, 70, 229, 0.08); color: var(--send-enabled); font-weight: 500; }
  .model-option .check { opacity: 0; }
  .model-option.active .check { opacity: 1; }

  /* ===== 左侧工具下拉菜单 ===== */
  .menu-dropdown { position: relative; }
  .menu-trigger { gap: 2px; }
  .menu-trigger .chevron { transition: transform 0.18s ease; }
  .menu-dropdown.open .menu-trigger .chevron { transform: rotate(180deg); }

  .menu-panel {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    min-width: 168px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-btn);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
    padding: 6px;
    z-index: 20;
    display: none;
  }
  .menu-dropdown.open .menu-panel { display: block; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    border-radius: 6px;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-model);
    transition: background 0.12s ease;
  }
  .menu-item:hover { background: var(--hover-bg); }
  .menu-item:active { background: var(--active-bg); }
  .menu-item svg { flex: 0 0 auto; color: var(--icon-stroke); }

  /* ===== 语音输入按钮 ===== */
  .voice-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: var(--radius-btn);
    padding: 8px;
    cursor: pointer;
    color: var(--icon-stroke);
    transition: background 0.15s ease, transform 0.08s ease, color 0.15s ease;
  }
  .voice-btn:hover { background: var(--hover-bg); }
  .voice-btn:active { background: var(--active-bg); transform: scale(0.96); }
  .voice-btn.listening { color: var(--send-enabled); background: rgba(79, 70, 229, 0.10); }
  .voice-btn:focus-visible { outline: 2px solid var(--send-enabled); outline-offset: 1px; }

  /* ===== 发送按钮 ===== */
  .send-btn {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: var(--radius-send);
    background: var(--send-enabled);
    cursor: pointer;
    color: #FFFFFF;
    transition: background 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
  }
  .send-btn:hover:not(:disabled) { background: var(--send-enabled-hover); }
  .send-btn:active:not(:disabled) { background: var(--send-enabled-active); transform: scale(0.94); }
  .send-btn:focus-visible { outline: 2px solid var(--send-enabled); outline-offset: 2px; }

  /* 无内容时置灰禁用 */
  .send-btn:disabled {
    background: var(--send-disabled);
    cursor: not-allowed;
    color: var(--send-disabled-icon);
  }

  /* ===== 响应式适配 ===== */
  @media (max-width: 640px) {
    body { padding: 12px; align-items: flex-end; }
    .chat-input-box { max-width: 100%; }

    .bottom-bar {
      flex-wrap: wrap;
      gap: 8px;
    }
    .right-controls {
      margin-left: auto;
    }
    .model-trigger .model-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  @media (max-width: 380px) {
    .model-name { display: none; }
  }
</style>
</head>
<body>
  <div class="chat-input-box" role="form" aria-label="聊天输入框">
    <!-- 多行文本区域 -->
    <textarea
      class="textarea"
      id="chatInput"
      rows="1"
      placeholder="帮你编写代码、调试 Bug、优化性能等开发工作，交付生产级代码产物。"
      aria-label="输入消息"></textarea>

    <!-- 底部操作栏 -->
    <div class="bottom-bar">
      <!-- 左侧：工具下拉菜单 -->
      <div class="menu-dropdown" id="toolsMenu">
        <button class="tool-btn menu-trigger" type="button" id="toolsTrigger" aria-haspopup="true" aria-expanded="false" aria-label="工具菜单" title="工具">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
          </svg>
          <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="menu-panel" id="toolsPanel" role="menu">
          <button class="menu-item" type="button" role="menuitem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>附件</span>
          </button>
          <button class="menu-item" type="button" role="menuitem">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>模式</span>
          </button>
          <button class="menu-item" type="button" role="menuitem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.75"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>技能</span>
          </button>
          <button class="menu-item" type="button" role="menuitem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 3h6v6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 14L21 3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>连接</span>
          </button>
        </div>
      </div>

      <!-- 右侧：模型选择 + 语音 + 发送 -->
      <div class="right-controls">
        <!-- 模型选择下拉 -->
        <div class="model-select" id="modelSelect">
          <button class="model-trigger" type="button" id="modelTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="model-name" id="modelName">DeepSeek-V4-Flash</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 9l6 6 6-6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="model-menu" role="listbox" id="modelMenu">
            <button class="model-option active" type="button" role="option" data-value="DeepSeek-V4-Flash" aria-selected="true">
              <span>内置模型 · DeepSeek-V4-Flash</span>
              <svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="model-option" type="button" role="option" data-value="自定义" aria-selected="false">
              <span>自定义</span>
              <svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <!-- 语音输入 -->
        <button class="voice-btn" type="button" id="voiceBtn" aria-label="语音输入" title="语音输入">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- 发送 -->
        <button class="send-btn" type="button" id="sendBtn" aria-label="发送" title="发送" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

<script>
  (function () {
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    /* 1. 多行文本区域自动撑开高度 */
    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 240) + 'px';
    }

    /* 5. 发送按钮：有内容高亮启用，无内容置灰禁用 */
    function syncSendState() {
      const hasContent = input.value.trim().length > 0;
      sendBtn.disabled = !hasContent;
    }

    input.addEventListener('input', function () {
      autoResize();
      syncSendState();
    });

    /* 发送动作（演示） */
    sendBtn.addEventListener('click', function () {
      if (sendBtn.disabled) return;
      console.log('发送内容：', input.value);
      input.value = '';
      autoResize();
      syncSendState();
      input.focus();
    });

    /* Enter 发送，Shift+Enter 换行 */
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendBtn.click();
      }
    });

    /* 模型下拉选择 */
    const modelSelect = document.getElementById('modelSelect');
    const modelTrigger = document.getElementById('modelTrigger');
    const modelName = document.getElementById('modelName');
    const modelMenu = document.getElementById('modelMenu');
    const options = modelMenu.querySelectorAll('.model-option');

    modelTrigger.addEventListener('click', function (e) {
      e.stopPropagation();
      const open = modelSelect.classList.toggle('open');
      modelTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    options.forEach(function (opt) {
      opt.addEventListener('click', function (e) {
        e.stopPropagation();
        options.forEach(function (o) {
          o.classList.remove('active');
          o.setAttribute('aria-selected', 'false');
        });
        opt.classList.add('active');
        opt.setAttribute('aria-selected', 'true');
        modelName.textContent = opt.dataset.value;
        modelSelect.classList.remove('open');
        modelTrigger.setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('click', function () {
      modelSelect.classList.remove('open');
      modelTrigger.setAttribute('aria-expanded', 'false');
      toolsMenu.classList.remove('open');
      toolsTrigger.setAttribute('aria-expanded', 'false');
    });

    /* 语音输入按钮（演示：切换聆听状态） */
    const voiceBtn = document.getElementById('voiceBtn');
    voiceBtn.addEventListener('click', function () {
      voiceBtn.classList.toggle('listening');
    });

    /* 左侧工具下拉菜单 */
    const toolsMenu = document.getElementById('toolsMenu');
    const toolsTrigger = document.getElementById('toolsTrigger');
    const toolsPanel = document.getElementById('toolsPanel');

    toolsTrigger.addEventListener('click', function (e) {
      e.stopPropagation();
      const open = toolsMenu.classList.toggle('open');
      toolsTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    toolsPanel.querySelectorAll('.menu-item').forEach(function (item) {
      item.addEventListener('click', function (e) {
        e.stopPropagation();
        const label = item.querySelector('span').textContent;
        console.log('工具：', label);
        toolsMenu.classList.remove('open');
        toolsTrigger.setAttribute('aria-expanded', 'false');
        /* 此处可挂载附件上传 / 模式切换 / 技能面板 / 连接配置等真实业务逻辑 */
      });
    });

    /* 初始化 */
    autoResize();
    syncSendState();
  })();
</script>
</body>
</html>
