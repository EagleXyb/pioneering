<svg viewBox="0 0 720 520" width="720" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="云边双模实施路线图：桌面主线五阶段加云端与移动端并行轨道">
  <style>
    :root {
      --surface: #F7F7F8;
      --surface-muted: #EFEFF2;
      --text: #171717;
      --text-muted: #52525B;
      --border: rgba(23, 23, 23, 0.12);
      --brand: #4B3FE3;
      --brand-soft: #F2F7FF;
      --brand-text: #1A1759;
      --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .pt { fill: var(--text); font: 500 16px/24px var(--font-sans); }
    .bc { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
    .th { fill: var(--text); font: 500 14px/20px var(--font-sans); }
    .ts { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
    .num { fill: var(--text); font: 500 13px/20px var(--font-mono); }
    .ph { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; }
    .phb { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.5; }
    .numb { fill: var(--brand); }
    .gbox { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; }
    .arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .sync { stroke: var(--text-muted); stroke-width: 1.3; stroke-dasharray: 5 4; stroke-linecap: round; fill: none; }
    .capsule { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1; }
    .capb { fill: var(--brand); font: 500 12px/18px var(--font-sans); }
    .leg-brand { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="mN3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <text class="pt" x="40" y="44">实施路线图 · 桌面主线五阶段 + 双并行轨道</text>
  <text class="bc" x="40" y="64">每阶段独立验收，可通过特性开关回退到 HTTP 模式</text>

  <line class="arr" x1="88" y1="96" x2="88" y2="452"/>

  <circle class="ph" cx="88" cy="116" r="14"/>
  <text class="num" x="88" y="121" text-anchor="middle">0</text>
  <text class="th" x="116" y="113">阶段 0 · 重构铺垫</text>
  <text class="ts" x="116" y="133">Transport 抽象 + 会话 runtime 字段，零行为变化</text>

  <circle class="ph" cx="88" cy="196" r="14"/>
  <text class="num" x="88" y="201" text-anchor="middle">1</text>
  <text class="th" x="116" y="193">阶段 1 · 边缘内核</text>
  <text class="ts" x="116" y="213">主进程内嵌 modu-agent，IPC 与 HTTP 双通道并存</text>

  <circle class="phb" cx="88" cy="276" r="14"/>
  <text class="num numb" x="88" y="281" text-anchor="middle">2</text>
  <text class="th" x="116" y="273">阶段 2 · 本地自治</text>
  <rect class="capsule" x="240" y="254" width="64" height="20" rx="10"/>
  <text class="capb" x="272" y="268" text-anchor="middle">关键路径</text>
  <text class="ts" x="116" y="293">本地持久化 + safeStorage 密钥 + 原生模块打包</text>

  <circle class="ph" cx="88" cy="356" r="14"/>
  <text class="num" x="88" y="361" text-anchor="middle">3</text>
  <text class="th" x="116" y="353">阶段 3 · 双模成型</text>
  <text class="ts" x="116" y="373">模式切换 UI + 按会话归属路由 + 云端 checkpoint 落盘</text>

  <circle class="ph" cx="88" cy="436" r="14"/>
  <text class="num" x="88" y="441" text-anchor="middle">4</text>
  <text class="th" x="116" y="433">阶段 4 · 同步加固</text>
  <text class="ts" x="116" y="453">本地→云单向同步 + utilityProcess 拆分 + 多端 HITL</text>

  <rect class="gbox" x="470" y="248" width="210" height="60" rx="8"/>
  <text class="th" x="575" y="272" text-anchor="middle">backend-ts 云端化</text>
  <text class="ts" x="575" y="292" text-anchor="middle">SqliteSaver · 事件版本化</text>

  <rect class="gbox" x="470" y="368" width="210" height="60" rx="8"/>
  <text class="th" x="575" y="392" text-anchor="middle">移动端客户端</text>
  <text class="ts" x="575" y="412" text-anchor="middle">复用云端 auth + SSE</text>

  <path class="sync" d="M 100,298 C 220,340 400,334 500,309" marker-end="url(#mN3)"/>
  <path class="sync" d="M 100,378 C 220,420 360,414 464,402" marker-end="url(#mN3)"/>

  <line class="arr" x1="40" y1="486" x2="66" y2="486"/>
  <text class="ts" x="74" y="491">主线顺序依赖</text>
  <line class="sync" x1="200" y1="486" x2="226" y2="486"/>
  <text class="ts" x="234" y="491">可并行轨道</text>
  <rect class="leg-brand" x="380" y="479" width="14" height="14" rx="3"/>
  <text class="ts" x="402" y="491">关键路径（阶段 2）</text>
</svg>
