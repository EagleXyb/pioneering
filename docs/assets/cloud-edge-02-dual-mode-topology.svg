<svg viewBox="0 0 720 548" width="720" height="548" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="云边双模架构图：桌面端可切本地或云端 Agent，移动端连云端">
  <style>
    :root {
      --surface: #F7F7F8;
      --surface-muted: #EFEFF2;
      --text: #171717;
      --text-muted: #52525B;
      --border: rgba(23, 23, 23, 0.12);
      --brand: #4B3FE3;
      --brand-soft: #F2F7FF;
      --brand-text: #1A1759;
      --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .pt { fill: var(--text); font: 500 16px/24px var(--font-sans); }
    .bc { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
    .th { fill: var(--text); font: 500 14px/20px var(--font-sans); }
    .ts { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
    g.c-neutral > rect { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; }
    g.c-brand > rect { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.5; }
    .c-brand > .th { fill: var(--brand-text); }
    .c-brand > .ts { fill: var(--brand); }
    g.c-ext > rect { fill: var(--surface-muted); stroke: var(--text-muted); stroke-width: 1.1; stroke-dasharray: 5 4; }
    .c-ext > .th { fill: var(--text-muted); }
    .c-ext > .ts { fill: var(--text-muted); }
    .arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arrb { stroke: var(--brand); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .sync { stroke: var(--text-muted); stroke-width: 1.3; stroke-dasharray: 5 4; stroke-linecap: round; fill: none; }
    .capsule { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .leg-b { stroke: var(--brand); stroke-width: 1.6; }
    .leg-n { stroke: var(--text-muted); stroke-width: 1.5; }
    .leg-d { stroke: var(--text-muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="mN2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
    <marker id="mB2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>

  <text class="pt" x="40" y="40">云边双模 · 同一 Agent 内核，两种投递路径</text>
  <text class="bc" x="40" y="60">云端与边缘共用 AGUI 协议与 modu-agent 内核，移动端只连云端</text>

  <g class="c-brand">
    <rect x="240" y="76" width="190" height="88" rx="8"/>
    <text class="th" x="335" y="104" text-anchor="middle">桌面应用</text>
    <text class="ts" x="335" y="124" text-anchor="middle">渲染进程 · 模式切换</text>
    <text class="ts" x="335" y="144" text-anchor="middle">AGUI 事件消费方</text>
  </g>

  <g class="c-neutral">
    <rect x="530" y="84" width="150" height="64" rx="8"/>
    <text class="th" x="605" y="108" text-anchor="middle">移动端</text>
    <text class="ts" x="605" y="130" text-anchor="middle">H5 / 小程序 / App</text>
  </g>

  <g class="c-neutral">
    <rect x="40" y="240" width="190" height="96" rx="8"/>
    <text class="th" x="135" y="268" text-anchor="middle">本地 Agent 运行时</text>
    <text class="ts" x="135" y="290" text-anchor="middle">主进程 · modu-agent</text>
    <text class="ts" x="135" y="310" text-anchor="middle">SQLite · safeStorage</text>
  </g>

  <g class="c-neutral">
    <rect x="490" y="240" width="190" height="96" rx="8"/>
    <text class="th" x="585" y="268" text-anchor="middle">云端 backend-ts</text>
    <text class="ts" x="585" y="290" text-anchor="middle">Fastify · modu-agent</text>
    <text class="ts" x="585" y="310" text-anchor="middle">Prisma · JWT 多端鉴权</text>
  </g>

  <g class="c-ext">
    <rect x="270" y="430" width="180" height="60" rx="8"/>
    <text class="th" x="360" y="454" text-anchor="middle">外部服务</text>
    <text class="ts" x="360" y="476" text-anchor="middle">LLM · MCP · 搜索</text>
  </g>

  <path class="arrb" d="M280,164 C 245,200 190,215 152,238" marker-end="url(#mB2)"/>
  <rect class="capsule" x="138" y="178" width="44" height="18" rx="9"/>
  <text class="ts" x="160" y="191" text-anchor="middle">IPC</text>

  <path class="arrb" d="M390,164 C 435,200 490,215 543,238" marker-end="url(#mB2)"/>
  <rect class="capsule" x="478" y="178" width="76" height="18" rx="9"/>
  <text class="ts" x="516" y="191" text-anchor="middle">HTTPS/SSE</text>

  <path class="arrb" d="M605,148 L605,236" marker-end="url(#mB2)"/>
  <rect class="capsule" x="615" y="200" width="40" height="18" rx="9"/>
  <text class="ts" x="635" y="213" text-anchor="middle">SSE</text>

  <path class="sync" d="M230,288 L490,288"/>
  <rect class="capsule" x="317" y="264" width="86" height="18" rx="9"/>
  <text class="ts" x="360" y="277" text-anchor="middle">本地会话同步</text>

  <path class="arr" d="M135,336 C 160,385 245,405 295,428" marker-end="url(#mN2)"/>
  <path class="arr" d="M585,336 C 560,385 475,405 425,428" marker-end="url(#mN2)"/>

  <line class="leg-b" x1="40" y1="516" x2="66" y2="516" marker-end="url(#mB2)"/>
  <text class="ts" x="74" y="521">AGUI 事件流</text>
  <line class="leg-n" x1="200" y1="516" x2="226" y2="516" marker-end="url(#mN2)"/>
  <text class="ts" x="234" y="521">HTTPS 外部调用</text>
  <line class="leg-d" x1="390" y1="516" x2="416" y2="516"/>
  <text class="ts" x="424" y="521">数据同步</text>
</svg>
